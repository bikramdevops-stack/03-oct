trigger:
 branches:
   include:
     - feature/*
     - main

pool: mypool

stages:
  - stage: scan
    displayName: scan stage
    jobs:
      - job: scan job
        displayName: scanning k liye
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tflint --recursive --force'

  - stage: Plan 
    displayName: Plan Stage
    jobs:
      - job: 
        displayName: Plan job
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'bhakuastorage'
              backendAzureRmContainerName: 'bhakuacontainer'
              backendAzureRmKey: 'prod.tfstate'
 
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'newservice'
          
  - stage: Apply
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    displayName: Apply stage
    jobs:
      
      - job: Approval
        displayName: Manual Approval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'ascnja@bcka'

      - job: Apply
        dependsOn: Approval
        displayName: Apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmStorageAccountName: 'bhakuastorage'
              backendAzureRmContainerName: 'bhakuacontainer'
              backendAzureRmKey: 'prod.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'newservice'