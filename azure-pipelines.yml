trigger:
 branches:
   include:
     - feature/*
     - main

pool: mypool

stages:
  - stage: tfsec
    displayName: tfsec
    jobs:
      - job: 
        displayName: tfsec
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tfsec'

  - stage: tflint
    displayName: tflint
    jobs:
      - job: tflint
        displayName: tflint
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'tflint --recursive --force'

  - stage: infracost
    displayName: infracost
    jobs:
      - job: infracost
        displayName: infracost
        steps:
          - task: InfracostSetup@2
            inputs:
              apiKey: 'ico-sqro8FlLxZss9ygbGP6Egl2USz9q8Y6Q'
              version: '0.10.x'

          - task: PowerShell@2
            displayName: Calculate Infra cost
            inputs:
              targetType: 'inline'
              script: 'infracost breakdown --path .'
  

  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        displayName: Validate
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmResourceGroupName: 'admin_rg'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'

  - stage: Plan
    displayName: Plan
    jobs:
      - job: Plan
        displayName: Plan
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmResourceGroupName: 'admin_rg'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'newservice'

  - stage: Apply
    displayName: Apply
    jobs:
      - job: Approval
        displayName: Approval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'sacas'
      - job: Apply
        dependsOn: Approval
        displayName: Apply
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'newservice'
              backendAzureRmResourceGroupName: 'admin_rg'
              backendAzureRmStorageAccountName: 'pipelinetfstate'
              backendAzureRmContainerName: 'xyzcontainer'
              backendAzureRmKey: 'terraform.tfstate'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'newservice'